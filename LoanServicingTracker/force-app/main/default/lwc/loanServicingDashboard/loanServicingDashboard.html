                                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>

                                </svg>
                            </div>
                            <div class="ps-kpi-content">
                                <span class="ps-kpi-label">Overdue Risk Accounts</span>
                                <span class="ps-kpi-value ps-text-red">{adminMetrics.overdueSchedules}</span>
                                <span class="ps-kpi-sub">{adminMetrics.pendingLoans} pending approvals</span>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Admin Master Table Toolbar -->
                <div class="ps-table-toolbar">
                    <div class="ps-toolbar-left">
                        <h2 class="ps-table-heading">Master Borrower Loan Accounts</h2>
                        <span class="ps-badge-counter">{allLoansCount} accounts</span>
                    </div>
                    <div class="ps-toolbar-right">
                        <div class="ps-search-box">
                            <svg class="ps-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input
                                type="text"
                                class="ps-search-input"
                                placeholder="Search borrower name, email or loan ID..."
                                value={adminSearchTerm}
                                oninput={handleAdminSearch}

                        <div class="ps-filter-tabs">
                            <button class={adminFilterAllClass} onclick={handleAdminFilterAll}>All</button>
                            <button class={adminFilterPendingClass} onclick={handleAdminFilterPending}>Pending</button>
                            <button class={adminFilterApprovedClass} onclick={handleAdminFilterApproved}>Approved</button>
                            <button class={adminFilterClosedClass} onclick={handleAdminFilterClosed}>Closed</button>
                        </div>
                    </div>
                </div>

                <!-- Master Loan Accounts Table -->
                <div class="ps-table-wrapper">
                    <template if:true={hasAdminLoans}>
                        <table class="ps-table">
                            <thead>
                                <tr>
                                    <th class="ps-th">Loan ID</th>
                                    <th class="ps-th">Borrower</th>
                                    <th class="ps-th">Email & Contact</th>
                                    <th class="ps-th ps-th-right">Principal</th>
                                    <th class="ps-th ps-th-center">Rate / Tenure</th>
                                    <th class="ps-th">Type</th>
                                    <th class="ps-th ps-th-center">Status</th>
                                    <th class="ps-th ps-th-center">Admin Controls</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={enrichedAdminLoans} for:item="l">
                                    <tr key={l.Id} class="ps-row">
                                        <td class="ps-td ps-td-bold">
                                            <a href="javascript:void(0);" onclick={handleViewScheduleDrilldown} data-id={l.Id} class="ps-link">
                                                {l.Name}
                                            </a>
                                        </td>
                                        <td class="ps-td">{l.Borrower_Name__c}</td>
                                        <td class="ps-td ps-td-muted">{l.Borrower_Email__c}</td>
                                        <td class="ps-td ps-td-right ps-td-bold">₹ {l.formattedPrincipal}</td>
                                        <td class="ps-td ps-td-center ps-td-muted">{l.Interest_Rate__c}% &bull; {l.Tenure_Months__c}m</td>
                                        <td class="ps-td">{l.Loan_Type__c}</td>
                                        <td class="ps-td ps-td-center">
                                            <span class={l.statusBadgeClass}>{l.Status__c}</span>
                                        </td>
                                        <td class="ps-td ps-td-center">
                                            <div class="ps-action-group">
                                                <template if:true={l.isPending}>
                                                    <button class="ps-btn-mini ps-btn-mini-green" onclick={handleQuickApprove} data-id={l.Id} title="Approve & Generate Schedules">
                                                        Approve
                                                    </button>
                                                    <button class="ps-btn-mini ps-btn-mini-red" onclick={handleQuickReject} data-id={l.Id} title="Reject Application">
                                                        Reject
                                                    </button>
                                                </template>
                                                <button class="ps-btn-mini ps-btn-mini-indigo" onclick={handleAdminOpenEdit} data-id={l.Id} title="Edit Profile & Terms">
                                                    Edit
                                                </button>
                                                <button class="ps-btn-mini ps-btn-mini-ghost" onclick={handleViewScheduleDrilldown} data-id={l.Id} title="Inspect Amortization Schedule">
                                                    Schedule
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>

                    <template if:false={hasAdminLoans}>
                        <div class="ps-empty-card">
                            <p class="ps-empty-text">No loan records match your search filter.</p>
                        </div>
                    </template>
                </div>
            </template>


            <!-- ═══════════════════════════════════════════════════════════════
                 ROLE 2: BORROWER SELF-SERVICE PORTAL (REGULAR USERS ONLY)
                 Admin CRM is strictly hidden for regular borrowers
            ════════════════════════════════════════════════════════════════ -->
            <template if:false={isAdminSession}>
                
                <!-- Borrower Account Strip -->
                <div class="ps-borrower-strip">
                    <div class="ps-borrower-info">
                        <div class="ps-avatar">{borrowerInitials}</div>
                        <div>
                            <div class="ps-borrower-name">{currentBorrowerName}</div>
                            <div class="ps-borrower-email">{currentUserEmail} &bull; {currentLoanType}</div>
                        </div>
                    </div>

                    <!-- Multi-Loan Switcher for this Borrower -->
                    <div class="ps-borrower-actions">
                        <template if:true={hasMultipleLoans}>
                            <div class="ps-loan-picker">
                                <label class="ps-picker-label">Active Loan:</label>
                                <select class="ps-picker-select" onchange={handleLoanSelect}>
                                    <template for:each={borrowerLoans} for:item="l">
                                        <option key={l.Id} value={l.Id}>{l.Name} (₹ {l.Principal_Amount__c} - {l.Status__c})</option>
                                    </template>
                                </select>
                            </div>
                        </template>

                        <div class={statusBadgeClass}>
                            <span class="ps-status-dot"></span>
                            <span>{loanStatusLabel}</span>
                        </div>

                        <button class="ps-btn ps-btn-secondary ps-btn-sm" onclick={handleOpenEditModal}>
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                            Edit Profile
                        </button>
                    </div>
                </div>

                <!-- Borrower KPI Cards Row -->
                <template if:true={summaryStats}>
                    <div class="ps-kpi-grid">
                        <div class="ps-kpi-card">
                            <div class="ps-kpi-icon ps-icon-indigo">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="2" y="3" width="20" height="14" rx="2"></rect>
                                    <line x1="8" y1="21" x2="16" y2="21"></line>
                                    <line x1="12" y1="17" x2="12" y2="21"></line>
                                </svg>
                            </div>
                            <div class="ps-kpi-content">
                                <span class="ps-kpi-label">Total Installments</span>
                                <span class="ps-kpi-value">{summaryStats.totalCount}</span>
                                <span class="ps-kpi-sub">Monthly EMI Schedule</span>
                            </div>
                        </div>

                        <div class="ps-kpi-card">
                            <div class="ps-kpi-icon ps-icon-green">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                                </svg>
                            </div>
                            <div class="ps-kpi-content">
                                <span class="ps-kpi-label">Amount Paid</span>
                                <span class="ps-kpi-value ps-text-green">₹ {formattedTotalPaid}</span>
                                <span class="ps-kpi-sub">{summaryStats.paidCount} EMIs settled</span>
                            </div>
                        </div>

                        <div class="ps-kpi-card">
                            <div class="ps-kpi-icon ps-icon-amber">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <polyline points="12 6 12 12 16 14"></polyline>
                                </svg>
                            </div>
                            <div class="ps-kpi-content">
                                <span class="ps-kpi-label">Remaining Balance</span>
                                <span class="ps-kpi-value ps-text-amber">₹ {formattedTotalPending}</span>
                                <span class="ps-kpi-sub">{summaryStats.pendingCount} EMIs remaining</span>
                            </div>
                        </div>

                        <div class="ps-kpi-card">
                            <div class="ps-kpi-icon ps-icon-red">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                                    <line x1="12" y1="9" x2="12" y2="13"></line>
                                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                                </svg>
                            </div>
                            <div class="ps-kpi-content">
                                <span class="ps-kpi-label">Overdue EMIs</span>
                                <span class="ps-kpi-value ps-text-red">{summaryStats.overdueCount}</span>
                                <span class="ps-kpi-sub">Immediate action required</span>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- 0-100% Repayment Progress Bar -->
                <template if:true={summaryStats}>
                    <div class="ps-progress-box">
                        <div class="ps-progress-header">
                            <div class="ps-progress-info">
                                <span class="ps-progress-title">Loan Repayment Progress</span>
                                <span class="ps-progress-sub">{summaryStats.paidCount} of {summaryStats.totalCount} installments cleared &bull; Instant Email Receipts Active</span>
                            </div>
                            <div class="ps-progress-pct">{summaryStats.progressPct}%</div>
                        </div>
                        <div class="ps-progress-track">
                            <div class="ps-progress-fill" style={progressBarStyle}></div>
                        </div>
                        <div class="ps-progress-milestones">
                            <span>0%</span>
                            <span>25%</span>
                            <span>50%</span>
                            <span>75%</span>
                            <span>100% Repaid</span>
                        </div>
                    </div>
                </template>

                <!-- Loan Terms Strip -->
                <template if:true={loanDetails}>
                    <div class="ps-loan-param-strip">
                        <div class="ps-param-item">
                            <span class="ps-param-label">Sanctioned Principal</span>
                            <span class="ps-param-value">₹ {formattedPrincipal}</span>
                        </div>
                        <div class="ps-param-divider"></div>
                        <div class="ps-param-item">
                            <span class="ps-param-label">Interest Rate</span>
                            <span class="ps-param-value">{loanDetails.Interest_Rate__c}% p.a.</span>
                        </div>
                        <div class="ps-param-divider"></div>
                        <div class="ps-param-item">
                            <span class="ps-param-label">Tenure</span>
                            <span class="ps-param-value">{loanDetails.Tenure_Months__c} Months</span>
                        </div>
                        <div class="ps-param-divider"></div>
                        <div class="ps-param-item">
                            <span class="ps-param-label">Monthly EMI</span>
                            <span class="ps-param-value ps-text-indigo">₹ {formattedEMI}</span>
                        </div>
                        <div class="ps-param-divider"></div>
                        <div class="ps-param-item">
                            <span class="ps-param-label">Total Payable</span>
                            <span class="ps-param-value">₹ {formattedTotalPayable}</span>
                        </div>
                    </div>
                </template>

                <!-- Table Toolbar -->
                <div class="ps-table-toolbar">
                    <div class="ps-toolbar-left">
                        <h2 class="ps-table-heading">My Repayment Schedule</h2>
                        <span class="ps-badge-counter">{scheduleCount} installments</span>
                    </div>
                    <div class="ps-toolbar-right">
                        <div class="ps-search-box">
                            <svg class="ps-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input
                                type="text"
                                class="ps-search-input"
                                placeholder="Search installments..."
                                value={searchTerm}
                                oninput={handleSearch}
                            />
                        </div>
                        <div class="ps-filter-tabs">
                            <button class={filterAllClass} onclick={handleFilterAll}>All</button>
                            <button class={filterPendingClass} onclick={handleFilterPending}>Pending</button>
                            <button class={filterPaidClass} onclick={handleFilterPaid}>Paid</button>
                            <button class={filterOverdueClass} onclick={handleFilterOverdue}>Overdue</button>
                        </div>
                    </div>
                </div>

                <!-- Repayment Schedule Table -->
                <div class="ps-table-wrapper">
                    <template if:true={hasSchedules}>
                        <table class="ps-table">
                            <thead>
                                <tr>
                                    <th class="ps-th ps-th-num">#</th>
                                    <th class="ps-th">Installment Ref</th>
                                    <th class="ps-th ps-th-right">EMI Amount</th>
                                    <th class="ps-th ps-th-right">Principal</th>
                                    <th class="ps-th ps-th-right">Interest</th>
                                    <th class="ps-th ps-th-right">Remaining</th>
                                    <th class="ps-th">Due Date</th>
                                    <th class="ps-th ps-th-center">Status</th>
                                    <th class="ps-th ps-th-center">Payment Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={filteredSchedules} for:item="s">
                                    <tr key={s.Id} class={s.rowClass}>
                                        <td class="ps-td ps-td-num">{s.rowIndex}</td>
                                        <td class="ps-td">
                                            <div class="ps-emi-cell">
                                                <span class="ps-emi-dot" data-status={s.Status__c}></span>
                                                <span class="ps-emi-name">{s.Name}</span>
                                            </div>
                                        </td>
                                        <td class="ps-td ps-td-right ps-td-bold">₹ {s.formattedEmi}</td>
                                        <td class="ps-td ps-td-right ps-td-muted">₹ {s.formattedPrincipal}</td>
                                        <td class="ps-td ps-td-right ps-td-muted">₹ {s.formattedInterest}</td>
                                        <td class="ps-td ps-td-right ps-td-muted">₹ {s.formattedBalance}</td>
                                        <td class="ps-td">
                                            <span class="ps-date-badge">{s.dueDateFormatted}</span>
                                        </td>
                                        <td class="ps-td ps-td-center">
                                            <span class={s.statusBadgeClass}>{s.Status__c}</span>
                                        </td>
                                        <td class="ps-td ps-td-center">
                                            <template if:false={s.isPaid}>
                                                <button
                                                    class="ps-btn-pay"
                                                    onclick={handleMarkPaid}
                                                    data-id={s.Id}
                                                    data-name={s.Name}
                                                    disabled={s.isProcessing}>
                                                    <template if:false={s.isProcessing}>
                                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                                            <polyline points="20 6 9 17 4 12"></polyline>
                                                        </svg>
                                                        Pay Now
                                                    </template>
                                                    <template if:true={s.isProcessing}>
                                                        <span class="ps-btn-spinner"></span>
                                                        Processing...
                                                    </template>
                                                </button>
                                            </template>
                                            <template if:true={s.isPaid}>
                                                <span class="ps-paid-pill">
                                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                                        <polyline points="20 6 9 17 4 12"></polyline>
                                                    </svg>
                                                    Paid
                                                </span>
                                            </template>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>

                    <template if:false={hasSchedules}>
                        <div class="ps-empty-card">
                            <div class="ps-empty-icon">
                                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                                    <line x1="8" y1="9" x2="16" y2="9"></line>
                                    <line x1="8" y1="13" x2="14" y2="13"></line>
                                </svg>
                            </div>
                            <h3 class="ps-empty-title">No Active Loan Schedules Found</h3>
                            <p class="ps-empty-text">
                                You do not have any approved active loans under <strong>{currentUserEmail}</strong>. Apply for a new loan below to get started!
                            </p>
                            <button class="ps-btn ps-btn-primary" onclick={handleOpenApplyModal}>Apply for a Loan</button>
                        </div>
                    </template>
                </div>
            </template>
        </template>


        <!-- ═══════════════════════════════════════════════════════════════════
             MODAL 1: APPLY FOR NEW LOAN (WITH LIVE REAL-TIME EMI CALCULATOR)
        ════════════════════════════════════════════════════════════════════ -->
        <template if:true={showApplyModal}>
            <div class="ps-modal-backdrop">
                <div class="ps-modal-card">
                    <div class="ps-modal-header">
                        <div>
                            <span class="ps-modal-tag">FINSPECTRA APPLICATION</span>
                            <h3 class="ps-modal-title">Submit Loan Application</h3>
                        </div>
                        <button class="ps-modal-close" onclick={handleCloseApplyModal}>&times;</button>
                    </div>
                    
                    <div class="ps-modal-body">
                        <div class="ps-form-grid">
                            <div class="ps-form-group">
                                <label class="ps-label">Borrower Full Name *</label>
                                <input type="text" class="ps-input" value={applyForm.borrowerName} oninput={handleApplyInput} data-field="borrowerName" placeholder="e.g. Priya Sharma" />
                            </div>
                            <div class="ps-form-group">
                                <label class="ps-label">Borrower Email Address *</label>
                                <input type="email" class="ps-input" value={applyForm.borrowerEmail} oninput={handleApplyInput} data-field="borrowerEmail" placeholder="e.g. priya.sharma@example.com" />
                            </div>
                            <div class="ps-form-group">
                                <label class="ps-label">Principal Amount (₹) *</label>
                                <input type="number" class="ps-input" value={applyForm.principal} oninput={handleApplyInput} data-field="principal" placeholder="500000" />
                            </div>
                            <div class="ps-form-group">
                                <label class="ps-label">Annual Interest Rate (% p.a.)</label>
                                <input type="number" step="0.1" class="ps-input" value={applyForm.interestRate} oninput={handleApplyInput} data-field="interestRate" placeholder="10.5" />
                            </div>
                            <div class="ps-form-group">
                                <label class="ps-label">Tenure (Months) *</label>
                                <input type="number" class="ps-input" value={applyForm.tenure} oninput={handleApplyInput} data-field="tenure" placeholder="12" />
                            </div>
                            <div class="ps-form-group">
                                <label class="ps-label">Loan Product Type</label>
                                <select class="ps-input" value={applyForm.loanType} onchange={handleApplyInput} data-field="loanType">
                                    <option value="Personal Loan">Personal Loan</option>
                                    <option value="Home Loan">Home Loan</option>
                                    <option value="Auto Loan">Auto Loan</option>
                                    <option value="Business Loan">Business Loan</option>
                                    <option value="Education Loan">Education Loan</option>
                                </select>
                            </div>
                        </div>

                        <!-- Real-Time Dynamic EMI Preview Box -->
                        <div class="ps-calculator-box">
                            <div class="ps-calc-header">
                                <span class="ps-calc-label">ESTIMATED REPAYMENT TERMS (LIVE PREVIEW)</span>
                            </div>
                            <div class="ps-calc-grid">
                                <div>
                                    <span class="ps-calc-sub">Monthly EMI:</span>
                                    <div class="ps-calc-value ps-text-green">₹ {previewEMI}</div>
                                </div>
                                <div>
                                    <span class="ps-calc-sub">Total Interest:</span>
                                    <div class="ps-calc-value ps-text-amber">₹ {previewInterest}</div>
                                </div>
                                <div>
                                    <span class="ps-calc-sub">Total Payable:</span>
                                    <div class="ps-calc-value">₹ {previewTotalPayable}</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="ps-modal-footer">
                        <button class="ps-btn ps-btn-ghost" onclick={handleCloseApplyModal}>Cancel</button>
                        <button class="ps-btn ps-btn-primary" onclick={handleSubmitApplication}>Submit Application</button>
                    </div>
                </div>
            </div>
        </template>


        <!-- ═══════════════════════════════════════════════════════════════════
             MODAL 2: EDIT BORROWER PROFILE & TERMS
        ════════════════════════════════════════════════════════════════════ -->
        <template if:true={showEditModal}>
            <div class="ps-modal-backdrop">
                <div class="ps-modal-card">
                    <div class="ps-modal-header">
                        <div>
                            <span class="ps-modal-tag">PROFILE & LOAN TERMS</span>
                            <h3 class="ps-modal-title">Modify Borrower Details</h3>
                        </div>
                        <button class="ps-modal-close" onclick={handleCloseEditModal}>&times;</button>
                    </div>
                    
                    <div class="ps-modal-body">
                        <p class="ps-modal-desc">Modifications will trigger a transactional notification email to the borrower's registered email address.</p>
                        <div class="ps-form-grid">
                            <div class="ps-form-group">
                                <label class="ps-label">Borrower Name</label>
                                <input type="text" class="ps-input" value={editForm.borrowerName} oninput={handleEditInput} data-field="borrowerName" />
                            </div>
                            <div class="ps-form-group">
                                <label class="ps-label">Borrower Email</label>
                                <input type="email" class="ps-input" value={editForm.borrowerEmail} oninput={handleEditInput} data-field="borrowerEmail" />
                            </div>
                            <div class="ps-form-group">
                                <label class="ps-label">Principal Amount (₹)</label>
                                <input type="number" class="ps-input" value={editForm.principal} oninput={handleEditInput} data-field="principal" />
                            </div>
                            <div class="ps-form-group">
                                <label class="ps-label">Interest Rate (% p.a.)</label>
                                <input type="number" step="0.1" class="ps-input" value={editForm.interestRate} oninput={handleEditInput} data-field="interestRate" />
                            </div>
                            <div class="ps-form-group">
                                <label class="ps-label">Tenure (Months)</label>
                                <input type="number" class="ps-input" value={editForm.tenure} oninput={handleEditInput} data-field="tenure" />
                            </div>
                            <div class="ps-form-group">
                                <label class="ps-label">Loan Type</label>
                                <input type="text" class="ps-input" value={editForm.loanType} oninput={handleEditInput} data-field="loanType" />
                            </div>
                        </div>
                    </div>

                    <div class="ps-modal-footer">
                        <button class="ps-btn ps-btn-ghost" onclick={handleCloseEditModal}>Cancel</button>
                        <button class="ps-btn ps-btn-primary" onclick={handleSaveProfileChanges}>Save & Notify Borrower</button>
                    </div>
                </div>
            </div>
        </template>


        <!-- ═══════════════════════════════════════════════════════════════════
             MODAL 3: DRILLDOWN REPAYMENT SCHEDULE MODAL FOR ADMIN
        ════════════════════════════════════════════════════════════════════ -->
        <template if:true={showDrilldownModal}>
            <div class="ps-modal-backdrop">
                <div class="ps-modal-card ps-modal-large">
                    <div class="ps-modal-header">
                        <div>
                            <span class="ps-modal-tag">AMORTIZATION LEDGER</span>
                            <h3 class="ps-modal-title">EMI Schedule: {drilldownLoanName} ({drilldownBorrower})</h3>
                        </div>
                        <button class="ps-modal-close" onclick={handleCloseDrilldownModal}>&times;</button>
                    </div>
                    
                    <div class="ps-modal-body">
                        <div class="ps-table-wrapper">
                            <table class="ps-table">
                                <thead>
                                    <tr>
                                        <th class="ps-th">Installment Ref</th>
                                        <th class="ps-th ps-th-right">EMI Amount</th>
                                        <th class="ps-th ps-th-right">Principal</th>
                                        <th class="ps-th ps-th-right">Interest</th>
                                        <th class="ps-th ps-th-right">Remaining</th>
                                        <th class="ps-th">Due Date</th>
                                        <th class="ps-th ps-th-center">Status</th>
                                        <th class="ps-th ps-th-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={drilldownSchedules} for:item="ds">
                                        <tr key={ds.Id} class="ps-row">
                                            <td class="ps-td ps-td-bold">{ds.Name}</td>
                                            <td class="ps-td ps-td-right ps-td-bold">₹ {ds.formattedEmi}</td>
                                            <td class="ps-td ps-td-right ps-td-muted">₹ {ds.formattedPrincipal}</td>
                                            <td class="ps-td ps-td-right ps-td-muted">₹ {ds.formattedInterest}</td>
                                            <td class="ps-td ps-td-right ps-td-muted">₹ {ds.formattedBalance}</td>
                                            <td class="ps-td">{ds.dueDateFormatted}</td>
                                            <td class="ps-td ps-td-center">
                                                <span class={ds.statusBadgeClass}>{ds.Status__c}</span>
                                            </td>
                                            <td class="ps-td ps-td-center">
                                                <template if:false={ds.isPaid}>
                                                    <button class="ps-btn-mini ps-btn-mini-green" onclick={handleDrilldownMarkPaid} data-id={ds.Id}>
                                                        Mark Paid
                                                    </button>
                                                </template>
                                                <template if:true={ds.isPaid}>
                                                    <span class="ps-paid-pill">Paid</span>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="ps-modal-footer">
                        <button class="ps-btn ps-btn-ghost" onclick={handleCloseDrilldownModal}>Close</button>
                    </div>
                </div>
            </div>
        </template>


        <!-- ── Toast Notifications ──────────────────────────────────────────── -->
        <template if:true={showToast}>
            <div class={toastClass} role="alert">
                <div class="ps-toast-icon">
                    <template if:true={toastSuccess}>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </template>
                    <template if:false={toastSuccess}>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="15" y1="9" x2="9" y2="15"></line>
                            <line x1="9" y1="9" x2="15" y2="15"></line>
                        </svg>
                    </template>
                </div>
                <div class="ps-toast-body">
                    <span class="ps-toast-title">{toastTitle}</span>
                    <span class="ps-toast-message">{toastMessage}</span>
                </div>
                <button class="ps-toast-close" onclick={handleCloseToast}>&times;</button>
            </div>
        </template>

    </div>
</template>
